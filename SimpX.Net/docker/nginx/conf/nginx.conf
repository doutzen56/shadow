worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_min_length  1k;
    gzip_buffers     16 64K;
    gzip_http_version 1.1;
    gzip_comp_level 5;
    gzip_types     text/plain application/javascript application/x-javascript text/javascript text/css application/xml;
    gzip_vary on;
    gzip_proxied   expired no-cache no-store private auth;
    gzip_disable   "MSIE [1-6]\.";

    upstream admin_api { server simpx-admin:5005; }
    upstream webapi_api { server simpx-webapi:5006; }
    upstream schedule_api { server simpx-schedule:5007; }
    upstream channels_api { server simpx-channels:5008; }

    server {
	    listen       443 ssl;
        listen       80;
        server_name  localhost;
        charset utf-8;
		ssl_certificate      /etc/nginx/key/abc.admin.com.pem;
        ssl_certificate_key  /etc/nginx/key/abc.admin.com.key;
        ssl_session_cache    shared:SSL:1m;

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
			if ( $uri = '/index.html' ) {
			    add_header Cache-Control "no-cache, no-store, must-revalidate";
			}
        }

		location /admin-api/hubs {
			proxy_pass http://admin_api/hubs;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

        location /admin-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://admin_api/;
        }

        location /webapi/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://webapi_api/;
        }

        location /channels/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://channels_api/;
        }

        # 调度宿主只对外开放调度看板；作业管理接口由 Admin 签名转发，不经网关暴露
        location /schedule/schedule {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://schedule_api/schedule;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
