# 先按 README 准备 .env 和 shared/Secrets.json，再 docker compose up -d
services:
  nginx:
    image: nginx:1.20.2
    ports:
      - "9100:80"
      - "9103:443"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ../Web/dist:/usr/share/nginx/html
      - "./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./nginx/key:/etc/nginx/key/"
    depends_on:
      - simpx-admin
      - simpx-webapi
      - simpx-schedule
      - simpx-channels

  # 默认是 Developer 版，只能用于开发和测试；正式环境按自己的授权设置 MSSQL_PID
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "9101:1433"
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?请在 docker/.env 里设置 MSSQL_SA_PASSWORD}
      - TZ=Asia/Shanghai
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:latest
    container_name: simpx-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis/data:/data:rw
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?请在 docker/.env 里设置 REDIS_PASSWORD}"]

  # 四个宿主共用一个库，依次启动：前一个起来了后一个再起，避免同时建表、写种子数据。
  # 每个宿主用镜像里自己的 Configuration，再叠加 shared（共用的部署配置和密钥）和自己的覆盖目录。
  simpx-admin:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ../SimpX.Net/SimpX.Net.Host.Admin/bin/Release/net10.0/:/app
      - ./shared:/app/Deploy/Shared:ro
      - ./admin:/app/Deploy/Host:ro
      - ./wait-for-it.sh:/app/wait-for-it.sh
    working_dir: /app
    command: ["/bin/bash", "-c", "/app/wait-for-it.sh sqlserver:1433 -t 120 && /app/wait-for-it.sh redis:6379 -t 60 && dotnet SimpX.Net.Host.Admin.dll"]
    depends_on:
      - sqlserver
      - redis

  simpx-schedule:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ../SimpX.Net/SimpX.Net.Host.Schedule/bin/Release/net10.0/:/app
      - ./shared:/app/Deploy/Shared:ro
      - ./schedule:/app/Deploy/Host:ro
      - ./wait-for-it.sh:/app/wait-for-it.sh
    working_dir: /app
    command: ["/bin/bash", "-c", "/app/wait-for-it.sh simpx-admin:5005 -t 300 && dotnet SimpX.Net.Host.Schedule.dll"]
    depends_on:
      - simpx-admin

  # WebApi 没有要单独覆盖的配置，只挂共用目录；以后要覆盖就建 docker/webapi 并挂到 /app/Deploy/Host
  simpx-webapi:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ../SimpX.Net/SimpX.Net.Host.WebApi/bin/Release/net10.0/:/app
      - ./shared:/app/Deploy/Shared:ro
      - ./wait-for-it.sh:/app/wait-for-it.sh
    working_dir: /app
    command: ["/bin/bash", "-c", "/app/wait-for-it.sh simpx-schedule:5007 -t 300 && dotnet SimpX.Net.Host.WebApi.dll"]
    depends_on:
      - simpx-schedule

  simpx-channels:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ../SimpX.Net/SimpX.Net.Host.Channels/bin/Release/net10.0/:/app
      - ./shared:/app/Deploy/Shared:ro
      - ./channels:/app/Deploy/Host:ro
      - ./wait-for-it.sh:/app/wait-for-it.sh
    working_dir: /app
    command: ["/bin/bash", "-c", "/app/wait-for-it.sh simpx-webapi:5006 -t 300 && dotnet SimpX.Net.Host.Channels.dll"]
    depends_on:
      - simpx-webapi

volumes:
  sqlserver-data:
