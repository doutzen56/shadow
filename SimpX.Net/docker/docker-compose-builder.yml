services:
  # 前端：用 package.json 里登记的 pnpm 版本，按锁文件安装。node_modules 用容器自己的，不碰本机的
  web-builder:
    image: node:22-alpine
    volumes:
      - ../Web/:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - COREPACK_NPM_REGISTRY=https://registry.npmmirror.com
      - npm_config_registry=https://registry.npmmirror.com
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm run build"

  # 后端：项目目标是 net10.0，要用 10.0 的 SDK
  net-builder:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - ../SimpX.Net/:/app
    working_dir: /app
    command: dotnet build SimpX.Net.sln -c Release
