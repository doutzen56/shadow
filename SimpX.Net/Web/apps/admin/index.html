<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" id="favicon" href="data:;base64,=" />
		<title>loading</title>
		<style>
			.loading-wrapper {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: #fff;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				z-index: 9999;
				color: #248067;
			}

			.loading-wrapper.hide {
				display: none;
			}

			/* 暗色下 loading 底色跟随主题，避免刷新时先白后暗闪一下 */
			html.dark .loading-wrapper {
				background: #101b2e;
			}

			.loader {
				width: 15px;
				aspect-ratio: 1;
				background: #248067;
				border-radius: 50%;
				animation: l6 1s infinite linear alternate;
			}
			@keyframes l6 {
				0% {
					box-shadow:
						15px 0,
						-25px 0;
				}
				50% {
					box-shadow:
						15px 0,
						-15px 0;
				}
				100% {
					box-shadow:
						25px 0,
						-15px 0;
				}
			}
		</style>
		<script>
			// 应用启动前按首屏标记把暗色写到 html 上，避免刷新时先白后暗；标记由主题写入口维护
			try {
				if (localStorage.getItem('app-theme') === 'dark') {
					var root = document.documentElement;
					root.classList.add('dark');
					root.setAttribute('data-theme', 'dark');
					root.setAttribute('data-vxe-ui-theme', 'dark');
				}
			} catch (e) {}
		</script>
		<script type="speculationrules">
			{
				"prerender": [{ "source": "document", "eagerness": "moderate" }]
			}
		</script>
	</head>

	<body>
		<div class="loading-wrapper">
			<div class="loader"></div>
		</div>
		<div id="app"></div>
		<script src="/config.js"></script>
		<script type="module" src="/src/main.ts"></script>
		<script src="/liveplayer-lib.min.js"></script>
		<script>
			window.addEventListener('load', function () {
				document.querySelector('.loading-wrapper').classList.add('hide');
			});
		</script>
	</body>
</html>
