project_id: hx-matching
display_name: HX.Matching
owner: @@DEVOPS
# 本项目只有 dev 和 uat 两套环境（没有 test）
default_envs:
  - dev
  - uat

environments:
  dev:
    description: 开发联调环境
    db:
      engine: sqlserver
      host: "<dev-db-host>"
      port: 1433
      database: "<dev-db-name>"
      username: "<dev-db-user>"
    redis:
      host: "<dev-redis-host>"
      port: 6379
      db: 0
    mq:
      engine: rabbitmq
      host: "<dev-mq-host>"
      port: 5672
      vhost: "<dev-vhost>"
      exchange: "<dev-exchange>"
      queue: "<dev-queue>"
  uat:
    description: 业务验收环境
    db:
      engine: sqlserver
      host: "<uat-db-host>"
      port: 1433
      database: "<uat-db-name>"
      username: "<uat-db-user>"
    redis:
      host: "<uat-redis-host>"
      port: 6379
      db: 0
    mq:
      engine: rabbitmq
      host: "<uat-mq-host>"
      port: 5672
      vhost: "<uat-vhost>"
      exchange: "<uat-exchange>"
      queue: "<uat-queue>"

verification:
  required_components:
    - db
    - redis
    - mq
  smoke_checks:
    - health_endpoint
    - create_test_order
    - callback_flow
  cleanup:
    strategy: 按测试标记清理
