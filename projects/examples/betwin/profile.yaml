governance_tag: 演进中的遗留系统
key_hosts:
  - 站点请求入口
  - 站点管理端
  - 平台系统端
  - 游戏与运维开放接口
  - 后台任务调度
  - 注单与数据分析
  - 消息消费
key_tech:
  - .NET Framework 4.8
  - ASP.NET Handler
  - SP.Studio 数据访问
  - Redis
  - RabbitMQ
  - Elasticsearch
  - Quartz
  - NLog
