frontend_source: 对照源为独立仓 Web.Admin（站点后台）与 Web.System（总后台）；本仓 WebSite/ 下前端项目一律忽略（用户 2026-10-26）。SimpX.Net admin↔Web.Admin、super-admin↔Web.System；界面操作与功能对齐旧版（用户 2026-10-31）
knowledge_strategy:
  - 项目档案放在项目样本目录
  - 架构与边界放入架构知识
  - 接口契约和工程约定放入工程知识
  - 真实事故放入经验教训
  - 业务仓库原文不整体复制
