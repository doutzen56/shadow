project_id: betwin
display_name: BetWin
owner: @@DEVOPS
# 本项目只有 test 一套环境（没有 dev、uat）
default_envs:
  - test

environments:
  test:
    description: 回归测试环境
    db:
      engine: sqlserver
      host: "<test-db-host>"
      port: 1433
      database: "<test-db-name>"
      username: "<test-db-user>"
    redis:
      host: "<test-redis-host>"
      port: 6379
      db: 0
    mq:
      engine: rabbitmq
      host: "<test-mq-host>"
      port: 5672
      vhost: "<test-vhost>"
      exchange: "<test-exchange>"
      queue: "<test-queue>"

verification:
  required_components:
    - db
    - redis
    - mq
  smoke_checks:
    - health_endpoint
    - member_wallet_read
    - payment_callback_flow
  cleanup:
    strategy: 按测试标记清理
