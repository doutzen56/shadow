project_name: SimpX.Net
project_type: 多宿主通用权限与多租户框架
identify_by: 工程名 SimpX.Net.sln（在仓库 SimpX.Net/ 子目录；不看工作区目录名和盘符）
simpx_path: projects/examples/simpx-net
stage: 一阶段真实项目样本（框架型）
primary_style: 企业稳定型
secondary_style: 业务交付型
extra_style: 遗留系统改造型
governance_tag: 演进中的框架拆分
key_hosts:
  - 总后台 SuperAdmin
  - 租户后台 Admin
  - 会员 WebApi
  - 调度 Schedule
  - 渠道 Channels
key_tech:
  - .NET 10
  - Furion
  - SqlSugar
  - Redis / Memory 缓存
  - Vue3 + Vite（Web monorepo）
  - SignalR
  - Elasticsearch（可选审计）
frontend_source: Web/（pnpm workspace：apps/admin、apps/super-admin、packages/shared）
knowledge_strategy:
  - 项目档案放在项目样本目录
  - 架构与边界放入架构知识
  - 接口契约和工程约定放入工程知识
  - 租户定租与宿主边界以 ADR-2026-10-28 为准
  - 业务仓库原文不整体复制
