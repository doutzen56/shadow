schema_version: v1
purpose: RAG ingestion 的机器可读清单。索引维护、自动修复和评估都以本文件登记的来源为准。
manifest_version: 0.4.0
status: active
path_rule: 路径一律相对 SimpX 根或业务仓根，不写盘符；业务仓用 solution_file 标识，运行时按 workspace-hosting.mdc 和 .sln 定位。

baseline:
  description: 全局 baseline，只在首次初始化或重建时更新；单项目导入只更新 latest_run 和 seed_projects.<id>。
  version: rag-baseline-20261018T083746Z
  run_id: 20261018T083746Z-baseline
  manifest_hash: 6814612077a36219bce0e45bddbba226564207de967a2234cb7b419a07d8d241
  manifest_hash_meaning: 本次导入的全部来源（路径 + 内容哈希）拼起来的哈希，见对应 init-report。
  generator: tools/rag_index.py bootstrap
  doc_sources: 117
  knowledge_items: 3
  sqlite_schema_version: rag-data-model-v2
  qdrant_collection_version: local-file-collection-v1
  embedding_model: not-configured-local-placeholder
  chunk_strategy: markdown-heading-yaml-top-key-code-summary
  routing_table_version: rag-x-routing-v2
  role_matrix_version: rag-role-matrix-v1

latest_run:
  run_id: 20261018T083109Z-project-hx-matching
  run_type: project_import
  project_id: hx-matching
  manifest_hash: b3b1b1fcce6109908d47118a027c6174e8db198290ab69c3fe12f86d8fe45027

artifact_policy:
  mode: pinned_baseline
  tracked_in_git:
    - rag/index.db
    - rag/init-reports/
    - rag/qdrant/
  rule: rag/ 产物跟版本库一起提交，作为可复现的 baseline 快照。每次重跑 tools/rag_index.py 后，rag/、knowledge/code-summaries/ 和本文件要放在同一次提交里；只提交其中一部分会让 manifest、摘要和 SQLite 对不上。
  rebuild: 按 tools/rag_index.py 文件开头的用法重建；重建后按 workflows/knowledge-index-maintenance 更新本文件。

vector_status:
  mode: placeholder
  semantic_recall_available: false
  note: rag/qdrant 只有集合占位，没有真实 embedding。接入真实向量前，只能用路径、关键词、人工索引和 Markdown 摘要检索，不能声称做过语义向量召回。

sources:
  hard_rules:
    path: .cursor/rules
    include: ["*.mdc"]
    embed: false
  configs:
    path: config
    include: ["*.yaml", "README.md"]
  agents:
    path: agents
    include: ["*/agent.yaml", "*/system.md", "*/workflows/README.md"]
  workflows:
    path: workflows
    include: ["**/*.md"]
  templates:
    path: templates
    include: ["**/*.md"]
  formal_knowledge:
    paths:
      - knowledge/patterns
      - knowledge/decisions
      - knowledge/incidents
      - knowledge/glossary
    include: ["**/*.md"]
  knowledge_indexes:
    path: knowledge/indexes
    include: ["*.md"]
  candidates:
    path: knowledge/candidates
    include: ["*.md"]
    retrieve_default: false
  project_profiles:
    path: projects/examples
    include: ["*/README.md", "*/profile.yaml", "*/boundaries.md", "*/architecture-map.md", "*/envs.yaml"]
  code_summaries:
    path: knowledge/code-summaries
    include: ["*/manifest.yaml", "*/*.md", "*/cards/*.md"]
    owner: tools/rag_index.py project（分组 Markdown 和 manifest 生成；cards 手写，只登记）

excluded:
  - path: core
    reason: 原则参考，按需确定性读取，不进检索。
  - path: .cursor/skills
    reason: 技能说明，按角色触发时确定性读取。
  - path: knowledge/raw
    reason: 原始层，不参与召回。
  - path: knowledge/archive
    reason: 归档层，不参与召回。
  - path: rag
    reason: 运行时产物和初始化报告，不作为知识来源。
  - path: tools
    reason: 导入脚本，不作为知识来源。
  - path: projects/profiles
    reason: 项目风格说明，按 profile.yaml 确定性读取。
  - glob: "**/envs.secrets.yaml"
    reason: 真实密钥。
  - glob: "**/envs.secrets.example.yaml"
    reason: 密钥模板，统一保守排除。
  - glob: "**/*.config"
    reason: 业务仓配置文件可能带连接串。
  - glob: "**/appsettings*.json"
    reason: 业务仓配置文件可能带连接串。

