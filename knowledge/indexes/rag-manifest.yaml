schema_version: v1
purpose: RAG ingestion 的机器可读清单。索引维护、自动修复和评估都以本文件登记的来源为准。
manifest_version: 0.4.0
status: active
path_rule: 路径一律相对 SimpX 根或业务仓根，不写盘符；业务仓用 solution_file 标识，运行时按 workspace-hosting.mdc 和 .sln 定位。

baseline:
  description: 全局 baseline，只在首次初始化或重建时更新；单项目导入只更新 latest_run 和 seed_projects.<id>。
  version: rag-baseline-20261019T161633Z
  run_id: 20261019T161633Z-baseline
  manifest_hash: 39c6e30836adcb11568f87205ddb4a06d73f133f1ae2468125a267efed22eadf
  manifest_hash_meaning: 本次导入的全部来源（路径 + 内容哈希）拼起来的哈希，见对应 init-report。
  generator: tools/rag_index.py bootstrap
  doc_sources: 136
  knowledge_items: 15
  sqlite_schema_version: rag-data-model-v3
  qdrant_collection_version: local-file-collection-v1
  embedding_model: not-configured-local-placeholder
  chunk_strategy: markdown-heading-yaml-top-key-code-summary
  routing_table_version: rag-x-routing-v2
  role_matrix_version: rag-role-matrix-v1
  note: 2026-10-20 为落盘 Host 定租户 ADR/档案后重建文档层；向量召回仍不可用。

latest_run:
  run_id: 20261019T161633Z-baseline
  run_type: bootstrap
  project_id: null
  manifest_hash: 39c6e30836adcb11568f87205ddb4a06d73f133f1ae2468125a267efed22eadf
  prior_project_import: 20261018T093230Z-project-hx-matching

artifact_policy:
  mode: rebuildable_index
  principle: 知识本体是 SimpX 里的 Markdown/YAML 文件，跟 git 走、日积月累；SQLite 只是这些文件的检索目录，随时能重建，不进 git。
  index_files:
    core: rag/index/core.db（规则、配置、角色、工作流、模板、知识、项目档案、导入记录；bootstrap 每次整层重写）
    projects: rag/index/projects/<project_id>.db（一个项目的代码层；project 每次整库重建，删掉的代码不残留）
    traces: rag/traces/<年-月>.db（检索轨迹和修复记录；保留 30 天，过期自动删除）
  tracked_in_git:
    - rag/init-reports/（每类只留最近 10 份，更早的自动删除）
    - rag/qdrant/
  not_tracked_in_git:
    - rag/index/
    - rag/traces/
  self_heal: search 发现 core.db 缺失会先自动 bootstrap；指定项目的库缺失且带 --repo 会先自动导入。换电脑后不用手工重建。
  rule: 重跑 tools/rag_index.py 后，knowledge/code-summaries/、rag/init-reports/ 和本文件放在同一次提交里。
  rebuild: 删掉 rag/index/，按 tools/rag_index.py 文件开头的用法重建；重建后按 workflows/knowledge-index-maintenance 更新本文件。

vector_status:
  mode: placeholder
  semantic_recall_available: false
  note: rag/qdrant 只有集合占位，没有真实 embedding。接入真实向量前，只能用路径、关键词、人工索引和 Markdown 摘要检索，不能声称做过语义向量召回。

sources:
  hard_rules:
    path: .cursor/rules
    include: ["*.mdc"]
    embed: false
  configs:
    path: config
    include: ["*.yaml", "README.md"]
  agents:
    path: agents
    include: ["*/agent.yaml", "*/system.md", "*/workflows/README.md"]
  workflows:
    path: workflows
    include: ["**/*.md"]
  templates:
    path: templates
    include: ["**/*.md"]
  formal_knowledge:
    paths:
      - knowledge/patterns
      - knowledge/decisions
      - knowledge/incidents
      - knowledge/glossary
    include: ["**/*.md"]
  knowledge_indexes:
    path: knowledge/indexes
    include: ["*.md"]
  candidates:
    path: knowledge/candidates
    include: ["*.md"]
    retrieve_default: false
  project_profiles:
    path: projects/examples
    include:
      - "*/README.md"
      - "*/profile.yaml"
      - "*/boundaries.md"
      - "*/architecture-map.md"
      - "*/envs.yaml"
      - "*/business-*.md"
      - "*/flows-*.md"
  code_summaries:
    path: knowledge/code-summaries
    include: ["*/manifest.yaml", "*/*.md", "*/cards/*.md"]
    owner: tools/rag_index.py project（分组 Markdown 和 manifest 生成；cards 手写，只登记）

excluded:
  - path: core
    reason: 原则参考，按需确定性读取，不进检索。
  - path: .cursor/skills
    reason: 技能说明，按角色触发时确定性读取。
  - path: knowledge/raw
    reason: 原始层，不参与召回。
  - path: knowledge/archive
    reason: 归档层，不参与召回。
  - path: rag
    reason: 运行时产物和初始化报告，不作为知识来源。
  - path: tools
    reason: 导入脚本，不作为知识来源。
  - path: projects/profiles
    reason: 项目风格说明，按 profile.yaml 确定性读取。
  - glob: "**/envs.secrets.yaml"
    reason: 真实密钥。
  - glob: "**/envs.secrets.example.yaml"
    reason: 密钥模板，统一保守排除。
  - glob: "**/*.config"
    reason: 业务仓配置文件可能带连接串。
  - glob: "**/appsettings*.json"
    reason: 业务仓配置文件可能带连接串。

