# 环境配置基线（全局）
schema_version: v1
status: 启用
owner: @@DEVOPS

# 可选环境名；每个项目实际有哪几套，以项目 envs.yaml 的 default_envs 为准，不要求三套齐全
# 例：hx-matching 只有 dev、uat；betwin 只有 test
可选环境:
  - dev
  - test
  - uat

全局规则:
  secrets_in_repo: false
  secret_file_pattern: "*.secrets.yaml"
  required_checks:
    - db_connectivity
    - redis_connectivity
    - mq_connectivity
    - smoke_api
  report_result:
    - 通过
    - 失败
    - 阻塞
  assertion_report_required_fields:
    - 验证项
    - 期望值
    - 实际值
    - 结论
    - 证据

项目配置约定:
  env_file: "projects/examples/<project-id>/envs.yaml"
  secret_file: "projects/examples/<project-id>/envs.secrets.yaml"
  # 项目在 envs.yaml 的 default_envs 里声明自己的环境集合（取值来自上面的可选环境），只校验声明了的环境
  include_envs: "按项目 default_envs"
