schema_version: v1
purpose: SimpX 当前生效规则清单。Agent 以这里登记的规则为准，不把规划目录误当成已启用规则。

priority:
  - user_message
  - active_rules
  - current_source_code
  - project_profile
  - workflow
  - role_definition
  - templates

rule_layers:
  runtime:
    source: .cursor/rules/agent-runtime-protocol.mdc
    status: enabled
    owner: "@@X"
  permission:
    source: .cursor/rules/permission-levels.mdc
    status: enabled
    owner: "@@X"
  task_intake:
    source: .cursor/rules/task-intake-checklist.mdc
    status: enabled
    owner: "@@X"
  evidence:
    source: .cursor/rules/evidence-standard.mdc
    status: enabled
    owner: "@@TL"
  completion:
    source: .cursor/rules/completion-definition.mdc
    status: enabled
    owner: "@@TL"
  simpx_core:
    source: .cursor/rules/simpx-core.mdc
    status: enabled
    owner: "@@X"
  workspace_hosting:
    source: .cursor/rules/workspace-hosting.mdc
    status: enabled
    owner: "@@X"
  git:
    source: .cursor/rules/git.mdc
    status: enabled
    owner: "@@DEVOPS"
  testing:
    source: .cursor/rules/testing.mdc
    status: enabled
    owner: "@@QA"
  coding:
    source: .cursor/rules/coding.mdc
    status: enabled
    owner: "@@BE"
  security:
    source: .cursor/rules/security.mdc
    status: enabled
    owner: "@@TL"
  encoding:
    source: .cursor/rules/encoding.mdc
    status: enabled
    owner: "@@X"
  ai_behavior:
    source: .cursor/rules/ai-behavior.mdc
    status: enabled
    owner: "@@TL"
  engineering_principles:
    source: .cursor/rules/engineering-principles.mdc
    status: enabled
    owner: "@@TL"
  knowledge_retrieval:
    source: .cursor/rules/knowledge-retrieval.mdc
    status: enabled
    owner: "@@X"
  contract_and_parallelism:
    source: .cursor/rules/contract-and-parallelism.mdc
    status: enabled
    owner: "@@X"

reference_layers:
  core:
    path: core/
    status: reference
    note: 原则、宪章和长期设计。与 active_rules 冲突时，以 active_rules 为准。
  templates:
    path: templates/
    status: reference
    note: 输出模板。只有工作流或角色明确引用时才使用。
  knowledge:
    path: knowledge/
    status: reference
    note: 长期经验库。是否沉淀由 @@TL 判断；正式知识由 @@TL 按证据确认后直接入库，用户周审修正；用户说「记住：」或「记一条 ADR」时直接入库。
  rag_specs:
    path: config/rag-*.yaml
    status: reference
    note: RAG 数据模型、导入、摘要、检索、上下文、治理、修复和评估配置。
  rag_manifest:
    path: knowledge/indexes/rag-manifest.yaml
    status: reference
    note: RAG ingestion 的机器可读清单。
  contracts:
    path: contracts/
    status: reference
    note: 契约说明、Schema 和模板；落文件的契约用 orchestration/tools/contract_validate.py 校验。
  orchestration:
    path: orchestration/
    status: reference
    note: 并行和任务状态策略、校验工具；执行器和隔离工作区还没接，只能出任务图。

checks:
  - 新增 alwaysApply 规则后，必须登记到 rule_layers。
  - 修改角色召唤标签或增删角色后，必须同步 config/simpx.yaml、README.md、.cursor/rules/simpx-core.mdc、agents/<role>/（agent.yaml、system.md、workflows/README.md）、config/rag-x-routing.yaml、config/rag-role-matrix.yaml 和 tools/rag_index.py 的 ALL_ROLES / CODE_ROLES / AGENT_DIR_TO_ROLE，再按 workflows/agent-governance/role-consistency-check.md 出一致性表。
  - 新增或改名 workflows/ 下的工作流后，必须同步 config/rag-x-routing.yaml 的 task_routing。
  - 规划目录不能当作已启用规则引用。
  - RAG 命中不能覆盖 active_rules、当前源码、项目档案和用户当前要求。
  - 当前源码与代码摘要、知识库或项目档案冲突时，以当前源码为准，并记录冲突。
  - 改契约 Schema、模板或 orchestration/policies/ 后，跑 contract_validate.py 和 orchestration/tests；改 tools/rag_index.py 后跑 tools/tests。
