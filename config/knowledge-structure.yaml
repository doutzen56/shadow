schema_version: v1
purpose: 可复用技术模式库（超级个体记忆）

storage_layers:
  - name: raw
    description: 任务原始信息层（实现、验证、问题、修复）
    path: knowledge/raw
    write_policy: "@@TL 判断要留原始记录时写入，见 config/rag-growth.yaml 的 write_policy.raw"
  - name: candidate
    description: 候选模式层（结构化提炼，待 @@TL 判断入库）
    path: knowledge/candidates
    write_policy: 任务结束由 @@TL 按价值判断是否产出
  - name: knowledge
    description: 正式知识层（@@TL 按证据确认后入库，用户周审修正）
    paths:
      - knowledge/patterns
      - knowledge/decisions
      - knowledge/incidents
      - knowledge/glossary
    note: 只有这四个目录算正式知识；knowledge/ 下其他目录各有自己的层，不能整个 knowledge/ 当正式知识。
    write_policy: "@@TL 按证据确认后直接写入；用户说「记住：」或「记一条 ADR」时直接写入"
  - name: code_summaries
    description: 业务代码摘要层（路径、符号、契约、依赖和风险标签）
    path: knowledge/code-summaries
    write_policy: 项目导入或代码变更后增量生成
  - name: archive
    description: 过期、驳回、合并后的知识层
    path: knowledge/archive
    write_policy: 周审、自动修复或人工确认后归档

pattern_card_required_fields:
  - pattern_id
  - title
  - domain
  - abstract_problem
  - goal_invariant
  - capability_components
  - state_invariants
  - key_methods
  - key_decision_nodes
  - algorithm_blueprint
  - adapter_points
  - non_negotiable_flow
  - key_parameters
  - tradeoffs
  - failure_contracts
  - rollback_strategy
  - verification_checklist
  - performance_cost
  - security_invariants
  - anti_patterns
  - source_projects
  - evidence_refs
  - reusable_assets
  - role_scope
  - task_scope
  - risk_tags
  - lifecycle_status
  - maturity
  - confirmed_by
  - user_reviewed

knowledge_metadata:
  lifecycle_status:
    meaning: 知识条目走到了哪一步
    values: [raw, candidate, confirmed, deprecated, rejected]
    source: config/rag-growth.yaml 的 states
  maturity:
    meaning: 模式本身被验证到什么程度，和 lifecycle_status 是两回事
    values: [draft, validating, validated]
  confirmed_by:
    meaning: 谁按证据确认入库；"@@TL" 或 user；规则生效前入库、来源不明的写“未记录”
  user_reviewed:
    meaning: 用户周审是否看过；@@TL 直接入库的先写 false
  index_status_note: rag/index.db 里 source、chunk、symbol 的 lifecycle_status 是索引状态（active、stale、missing 等，见 rag-data-model.yaml 的 status_values），不是知识生命周期。

pattern_domains:
  - search
  - cache
  - messaging
  - data-consistency
  - reliability
  - rollout

candidate_review_cycle:
  cadence: weekly
  owner: "@@X"
  approver: "@@TL"
  final_review: 用户周审，可回退或修正 @@TL 已入库的条目
  outcomes:
    - promote_to_knowledge
    - merge_existing_pattern
    - reject

execution_rules:
  - 方案输出前优先检索已有模式
  - 若未复用模式，必须说明原因
  - 遇到失败案例，优先补充候选模式卡
  - 知识主体必须先写抽象层（能力/契约/状态机/策略点）
  - 代码内容仅作为证据引用，禁止整文件复制
  - 必须明确核心功能不变量，确保可跨项目复写同等核心能力
  - RAG 命中不得覆盖 active_rules、当前源码、项目档案和用户当前要求
  - 代码摘要只能作为定位锚点，行为结论必须回读当前源码

retrieval_policy:
  strategy: index_first_then_top_k
  max_patterns_per_query: 3
  max_rounds_per_query: 2
  full_scan_allowed: false
  max_code_refs_per_pattern: 5
  max_code_snippets_per_pattern: 2
  snippet_max_lines: 40
  required_index_filters:
    - domain
    - stack
    - scene
    - project_scope
    - role_scope
    - task_scope
    - risk_tags
  token_budget:
    max_chars_per_round: 12000
    prefer_summary_before_code: true
    escalate_when_budget_exceeded: true
  escalate_to_user_when:
    - top_k_results_insufficient_after_two_rounds
    - ambiguous_pattern_selection
    - role_scope_conflict
    - project_scope_uncertain

code_asset_rules:
  required_fields:
    - asset_id
    - asset_type
    - source_repo
    - file_path
    - symbol
    - scenario
    - input_contract
    - output_contract
    - failure_contract
    - dependencies
    - observability
    - snippet_or_ref
  asset_types:
    - endpoint-flow
    - domain-service
    - state-machine
    - mq-consumer
    - cache-strategy
    - retry-policy
    - compensation-flow
  quality_gate:
    abstraction_first: true
    require_capability_contract_state_machine: true
    must_be_executable_context: true
    must_have_boundary_notes: true
    must_have_risk_notes: true
    allow_pseudocode_only: false
  dedup_policy:
    strategy: variant_over_duplicate
    same_pattern_threshold: 0.75
    variant_required_fields:
      - different_scene
      - different_tradeoff
      - different_failure_mode
