schema_version: v1
purpose: 现有 SimpX 适配清单，记录 RAG 落地时哪些保留、修改、降权、排除或新增。

stable_keep:
  - .cursor/rules/agent-runtime-protocol.mdc
  - .cursor/rules/permission-levels.mdc
  - .cursor/rules/evidence-standard.mdc
  - .cursor/rules/completion-definition.mdc
  - .cursor/rules/workspace-hosting.mdc
  - workflows/_shared
  - agents/*/system.md
  - projects/examples/*/README.md
  - projects/examples/*/profile.yaml
  - projects/examples/*/boundaries.md

modify:
  - path: config/active-rules.yaml
    reason: 登记 knowledge-retrieval.mdc 和 RAG 参考层。
  - path: config/knowledge-structure.yaml
    reason: 增加 raw、code_summaries、archive、RAG 元数据和自动修复策略。
  - path: agents/orchestrator/system.md
    reason: 补 @@X RAG Routing。
  - path: workflows/project-init/README.md
    reason: 增加项目导入后的 RAG 注册。
  - path: workflows/agent-governance/README.md
    reason: 增加 RAG 语料、召回质量和自动修复巡检。

downrank_or_exclude:
  - path: core/constitution
    rule: 与 active rules 重复时降权或排除。
  - path: core/roles
    rule: 与 agents/*/system.md 重复时以 agents 为准。
  - path: knowledge/archive
    rule: 默认不召回。
  - path: knowledge/raw
    rule: 默认不召回。

new_files:
  - config/rag-data-model.yaml
  - config/rag-importer.yaml
  - config/rag-summarizer.yaml
  - config/rag-retrieval.yaml
  - config/rag-context-engine.yaml
  - config/rag-growth.yaml
  - config/rag-governance.yaml
  - config/rag-repair.yaml
  - config/rag-evaluation.yaml
  - .cursor/rules/knowledge-retrieval.mdc