schema_version: v1
purpose: 角色知识矩阵。@@X 用它把 RAG 命中按角色职责分发，避免所有角色共享同一批无差别知识。

defaults:
  max_items_per_role_stage: 3
  max_rounds_per_role_stage: 2
  require_project_filter_first: true
  candidate_default_retrieve: false
  current_source_over_summary: true

roles:
  X-01:
    tag: "@@X"
    focus:
      - 任务类型判断
      - 权限等级
      - 工作流路由
      - 角色链路
      - 风险标签
      - 检索范围裁剪
    preferred_doc_types:
      - routing_rule
      - workflow_index
      - project_profile
      - governance_rule
      - retrieval_policy
  TL-01:
    tag: "@@TL"
    focus:
      - 目标与优先级
      - 验收标准
      - 风险裁决
      - 放行判断
      - 重大取舍
    preferred_doc_types:
      - decision
      - release_gate
      - risk_summary
      - project_profile
  BA-01:
    tag: "@@BA"
    focus:
      - 模块边界
      - 调用关系
      - 数据流
      - 状态流
      - 外部依赖
      - 兼容约束
      - 演进方案
      - 回滚影响
    preferred_doc_types:
      - architecture_boundary
      - project_boundary
      - pattern
      - decision
      - code_summary_boundary
  BE-01:
    tag: "@@BE"
    focus:
      - 实现步骤
      - 代码摘要
      - 失败路径
      - 幂等
      - 重试
      - 兼容实现
      - 断言草案
    preferred_doc_types:
      - code_summary
      - implementation_pattern
      - assertion_template
      - pattern
  FE-01:
    tag: "@@FE"
    focus:
      - 前端领域架构
      - 页面与业务模块边界
      - 组件体系
      - 状态管理与数据获取
      - API 客户端和错误处理
      - 前端性能、安全与可访问性
      - 构建、测试与部署约束
      - 公共组件契约
    preferred_doc_types:
      - frontend_architecture
      - project_profile
      - api_contract
      - frontend_pattern
      - code_summary
      - test_strategy
  QA-01:
    tag: "@@QA"
    focus:
      - 验收标准
      - 断言比对
      - 场景验证
      - 契约测试
      - 集成与回归测试
      - 测试数据与清理方式
      - 实际结果和证据
      - 未覆盖风险
    preferred_doc_types:
      - acceptance_contract
      - test_plan
      - assertion_template
      - validation_template
      - evidence_pack
      - incident
      - code_summary_validation
  DEVOPS-01:
    tag: "@@DEVOPS"
    focus:
      - 环境来源
      - DB/Redis/ES/MQ 连通检查
      - 部署与冒烟
      - 发布检查项
      - 回滚建议
    preferred_doc_types:
      - environment_profile
      - evidence_pack
      - release_gate
  reviewer:
    focus:
      - 高风险缺陷
      - 安全
      - 数据一致性
      - 兼容性
      - 稳定性
      - 断言缺口
      - 回滚缺口
      - 过度设计
    preferred_doc_types:
      - review_checklist
      - risk_pattern
      - incident
      - code_summary_risk
  researcher:
    focus:
      - 方案对比
      - 最小实验
      - 技术调研
      - 外部方案摘要
      - 不确定性
    preferred_doc_types:
      - research_note
      - decision
      - experiment_result
      - pattern

handoff_rules:
  - 每个角色阶段只接收本棒需要的知识，不把全量检索结果传给下一棒。
  - 交接块要记录采用了哪些知识、丢弃了哪些知识，以及丢弃原因。
  - 代码摘要只能作为定位锚点；涉及行为结论时必须回读当前源码。
  - candidate 只在沉淀、复盘、治理和 RAG 运维任务中默认可见。

metadata_required:
  - role_scope
  - task_scope
  - project_scope
  - risk_tags
  - maturity
  - source_type
  - evidence_refs