schema_version: v1
purpose: 代码摘要生成策略。摘要用于定位和初筛，不替代当前源码。

implemented:
  note: 现在由 tools/rag_index.py project 自动生成的是 group 级 Markdown 和 file 级定位记录（路径、哈希、符号、风险标签）；下面 file 的 responsibility/dependencies 和 symbol、flow 级字段不自动生成。
  group_markdown: knowledge/code-summaries/<project-id>/<group_id>.md（脚本生成，下次导入覆盖）
  file_locator: rag/index/projects/<project-id>.db 的 source、chunk、symbol 表
  deep_dive_card: knowledge/code-summaries/<project-id>/cards/<summary_id>.md（高风险文件按模板手写，脚本只登记，哈希对不上标 stale）

levels:
  file:
    description: 文件级职责、宿主、主要依赖和风险标签。
    required_fields:
      - project_id
      - file_path
      - file_hash
      - responsibility
      - host_or_layer
      - dependencies
      - risk_tags
      - last_seen
  symbol:
    description: 类、方法、Handler、Job、Gateway 等符号级摘要。
    required_fields:
      - symbol_id
      - symbol
      - symbol_kind
      - file_path
      - input_contract
      - output_contract
      - failure_contract
      - dependencies
      - observability
      - role_scope
      - risk_tags
  flow:
    description: 入口到核心逻辑的业务流摘要。
    required_fields:
      - flow_id
      - entry_symbol
      - downstream_symbols
      - state_changes
      - external_dependencies
      - verification_points

chunk_policy:
  large_file:
    first_pass: file_summary
    expand_when:
      - matched_by_query
      - high_risk_tag
      - referenced_by_pattern
  max_summary_chars: 1200
  max_symbol_summary_chars: 800

hash_policy:
  file_hash: sha256_of_file_content
  signature_hash: sha256_of_symbol_signature
  stale_when:
    - file_hash_changed
    - symbol_missing
    - project_profile_changed

risk_tags:
  - funds
  - order-state
  - permission
  - login
  - user-data
  - production-config
  - database-schema
  - public-contract
  - callback
  - idempotency
  - retry
  - async
  - cache-consistency
  - mq
  - elasticsearch
  - gateway

skipped_policy:
  in_summary: 只写跳过数量和原因分类，不列路径
  details: 只写入 rag/init-reports/<run_id>.json
  sensitive_paths_in_summary: false

summary_manifest_required_fields:
  - project_id
  - status
  - source_profile
  - solution_file
  - last_ingestion_run
  - summarized_files
  - summary_groups
  - forbidden_scope
  - notes

output:
  root: knowledge/code-summaries
  manifest_name: manifest.yaml
  card_template: templates/code-summary-card/README.md
  card_template_scope: 只用于 cards/ 下手写的高风险深挖卡，不是分组摘要的格式。