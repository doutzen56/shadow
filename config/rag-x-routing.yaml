schema_version: v1
purpose: "@@X RAG Routing。根据需求自动匹配项目、任务类型、风险、工作流、角色链路、知识和代码摘要。"

inputs:
  - user_message
  - summoned_tags
  - workspace_root
  - solution_file
  - explicit_project_name
  - open_files
  - recent_context

project_routing:
  order:
    - solution_file_to_workspace_hosting
    - explicit_project_name_to_profile
    - profile_identify_by
  unknown_action: ask_user

# 值是单个工作流时直接用；值是 *_decision_tree 时按下面对应的决策树选，判断不了就问用户。
task_routing:
  只读分析: readonly_decision_tree
  方案设计: requirement-to-design
  缺陷定位: bug-fix
  代码实现: implementation_decision_tree
  代码审查: code-review
  测试验证: testing_decision_tree
  发布交付: release
  事故处理: incident-response
  规则或文档沉淀: agent-governance
  项目接入: project-init
  知识库/RAG运维: rag_ops_decision_tree

readonly_decision_tree:
  pure_analysis_or_question: none
  need_design_conclusion: requirement-to-design
  unclear_action: ask_user
  note: none 表示不套工作流，走 role_chain.readonly_simple，按 completion-definition.mdc 的“只读分析”收口。

implementation_decision_tree:
  design_confirmed_need_task_breakdown: design-to-code
  end_to_end_feature: feature-development
  unclear_action: ask_user
  note: design-to-code 只产出编码任务清单和断言，进入实现后仍回到 feature-development 的步骤 3 起收口。

testing_decision_tree:
  implementation_in_progress: feature-development
  implementation_done_need_retest_or_env_delivery: release
  unclear_action: ask_user
  note: 实现还没完成断言和 BE 自验证的，不能走 release，见 workflows/release/README.md。

task_end_hooks:
  knowledge_sediment: knowledge-growth-loop
  write_candidate: knowledge-candidate-intake
  note: 任务收口后由 @@TL 按 knowledge-growth-loop 判断；要写 candidate 时再进 knowledge-candidate-intake。

rag_ops_decision_tree:
  default_workflows:
    - knowledge-rag-bootstrap
    - knowledge-project-import
    - knowledge-index-maintenance
    - knowledge-auto-repair
    - knowledge-rag-evaluation
  first_setup_or_rebuild: knowledge-rag-bootstrap
  new_project_or_new_repo: knowledge-project-import
  docs_or_summary_changed: knowledge-index-maintenance
  health_check_failed: knowledge-auto-repair
  quality_or_recall_check: knowledge-rag-evaluation
  unclear_action: ask_user

risk_tags:
  high_risk:
    - funds
    - order-state
    - permission
    - login
    - user-data
    - production-config
    - secret
    - database-schema
    - public-contract
  extra_score:
    - callback
    - idempotency
    - retry
    - cache-consistency
    - async
    - mq
    - elasticsearch

# 当前生效的主路由。@@X 按流程评分选一条，再按 domain_substitution 换领域角色。
role_chain:
  fast: ["@@X", "@@BE", "@@X"]
  readonly_simple: ["@@X", "@@BA", "@@X"]
  standard: ["@@X", "@@TL", "@@BA", "@@BE", "@@DEVOPS", "@@QA", "@@TL"]
  high_risk: ["@@X", "@@TL", "@@BA", "@@BE", "reviewer", "@@DEVOPS", "@@QA", "@@TL"]

domain_substitution:
  backend_only: 按 role_chain 原样走
  frontend_only: "@@BA 和 @@BE 都换成 @@FE"
  full_stack: "@@BA 阶段同时进 @@FE 出前端方案；@@BE 阶段同时进 @@FE 做前端实现；跨领域契约交 @@TL 批准"
  devops_skip: 不需要真实环境、部署或基础组件验证时跳过 @@DEVOPS，在调度状态块写明原因
  note: 领域按任务实际改动的路径判断，不按需求描述猜；判断不了就问用户。

# 2.0 按阶段 + 参与条件路由。status 为 reference 时只作参考，主路由仍是上面的 role_chain；
# 演练验证通过后再决定要不要切主路由、删 role_chain。
role_stages:
  status: reference
  stages:
    - id: intake
      roles: ["@@X"]
      when: 所有任务
    - id: system_design
      roles: ["@@TL"]
      when: 跨领域、跨模块、改公共契约或高风险
    - id: domain_design
      roles: ["@@BA", "@@FE"]
      when: 按涉及的领域进对应角色；只读分析只进一个领域角色
    - id: contract_review
      roles: ["@@TL", "@@BA", "@@FE", "@@QA"]
      when: 有接口、数据或共享组件契约要新建或变更；只拉受影响的领域
    - id: task_planning
      roles: ["@@X"]
      when: 要拆成两个以上任务；产出任务图，按 orchestration/policies/parallelism.yaml 判并行类别
    - id: implementation
      roles: ["@@BE", "@@FE"]
      when: 按任务的 owner_role 分派
    - id: review
      roles: ["reviewer"]
      when: 高风险链路
    - id: integration
      roles: ["@@X"]
      when: 两个以上任务合并；冲突回到具体任务的 owner 处理
    - id: environment
      roles: ["@@DEVOPS"]
      when: 需要真实环境、部署或基础组件验证
    - id: verification
      roles: ["@@QA"]
      when: 改了行为的任务；0 分快线只做最小检查
    - id: release_decision
      roles: ["@@TL"]
      when: 标准链路和高风险链路
    - id: knowledge_sediment
      roles: ["@@TL"]
      when: 任务收口后按 knowledge-growth-loop 判断

outputs:
  - task_type
  - permission_level
  - project_id
  - workflow
  - role_chain
  - domains
  - risk_tags
  - retrieval_scopes
  - needs_user_decision