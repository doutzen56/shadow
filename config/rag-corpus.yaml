schema_version: v1
purpose: RAG 语料分区与索引边界。用于限制哪些内容能进检索、能否向量化，以及召回优先级上限。

defaults:
  full_scan_allowed: false
  require_manifest: true
  source_of_truth: local_files
  formal_knowledge_requires_confirmation: true
  formal_knowledge_confirmed_by: "@@TL 或用户"
  business_code_policy: summary_only

corpus_layers:
  hard_rules:
    paths: [.cursor/rules]
    embed_allowed: false
    deterministic_load: true
    priority_ceiling: active_rules
  configs:
    paths: [config]
    embed_allowed: false
    deterministic_load: true
    priority_ceiling: active_rules
    notes: active-rules.yaml、simpx.yaml 和对应 rag-*.yaml 按规则确定性读取；进 SQLite 只为关键词定位。
  agents:
    paths: [agents]
    embed_allowed: true
    deterministic_load_when_summoned: true
    priority_ceiling: role_definition
  workflows:
    paths: [workflows]
    embed_allowed: true
    deterministic_load_by_task_type: true
    priority_ceiling: workflow
  templates:
    paths: [templates]
    embed_allowed: true
    deterministic_load_when_referenced: true
    priority_ceiling: templates
  knowledge_indexes:
    paths: [knowledge/indexes]
    embed_allowed: false
    deterministic_load: true
    notes: 人工索引先于向量检索读取。
  formal_knowledge:
    paths:
      - knowledge/patterns
      - knowledge/decisions
      - knowledge/incidents
      - knowledge/glossary
    embed_allowed: true
    retrieve_allowed: true
  knowledge_candidate:
    paths: [knowledge/candidates]
    embed_allowed: true
    retrieve_allowed: false
    retrieve_allowed_for:
      - 规则或文档沉淀
      - 知识库/RAG运维
      - 事故处理
  project_profiles:
    paths: [projects/examples]
    embed_allowed: true
    deterministic_load_by_workspace: true
  business_code_summaries:
    paths: [knowledge/code-summaries]
    embed_allowed: true
    retrieve_allowed: true
    notes: 只保存摘要、路径、符号和风险标签。行为结论必须回读当前源码。
  raw:
    paths: [knowledge/raw]
    embed_allowed: false
    retrieve_allowed: false
  archive:
    paths: [knowledge/archive]
    embed_allowed: false
    retrieve_allowed: false

excluded_paths:
  - path: core
    reason: 原则参考，按需确定性读取，不进检索。
  - path: .cursor/skills
    reason: 技能说明，按角色触发时确定性读取。
  - path: rag
    reason: 运行时产物和初始化报告。
  - path: tools
    reason: 导入脚本。
  - path: projects/profiles
    reason: 项目风格说明，按 profile.yaml 确定性读取。

forbidden_globs:
  - "**/envs.secrets.yaml"
  - "**/envs.secrets.example.yaml"
  - "**/*.pfx"
  - "**/*.key"
  - "**/*.pem"
  - "**/*.config"
  - "**/appsettings*.json"
  - "**/bin/**"
  - "**/obj/**"
  - "**/node_modules/**"
  - "**/.git/**"
  - "**/dist/**"
  - "**/packages/**"
  - "**/*.log"

forbidden_notes:
  - 日志按文件后缀排除（*.log），不按目录名排除；业务代码里叫 Logs 的目录是源码。
  - 以上路径规则要和 knowledge/indexes/rag-manifest.yaml 的 excluded、config/rag-importer.yaml 的 security 保持一致，改一处要同步另外两处。

chunking:
  markdown: heading_sections
  yaml: top_level_keys
  mdc: frontmatter_plus_sections
  code_summary: asset_records

index_outputs:
  manifest: knowledge/indexes/rag-manifest.yaml
  sqlite_core: rag/index/core.db
  sqlite_projects: rag/index/projects/<project-id>.db
  sqlite_traces: rag/traces/<YYYY-MM>.db
  qdrant_root: rag/qdrant